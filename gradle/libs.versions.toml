[versions]
junit = "5.14.3"
dokka = "2.2.0"
ksp = "2.3.7"
nmcp = "1.6.1"

[libraries]
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-runtime = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
# https://github.com/ZacSweers/kotlin-compile-testing
kotlin-compileTestingKsp = "dev.zacsweers.kctfork:ksp:0.12.1"
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

[plugins]
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
jvm = "org.jetbrains.kotlin.jvm:2.4.10"
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
nmcp-aggregation = { id = "com.gradleup.nmcp.aggregation", version.ref = "nmcp" }
spotless = "com.diffplug.spotless:8.9.0"
